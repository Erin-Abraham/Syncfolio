services:
  postgres:
    image: postgres:16-alpine
    container_name: syncfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncfolio_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-syncfolio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncfolio_user} -d ${POSTGRES_DB:-syncfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - syncfolio-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncfolio_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syncfolio-net

volumes:
  postgres_data:
    driver: local

networks:
  syncfolio-net:
    driver: bridge